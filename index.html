<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>整數加減大決鬥 - 雙人線上對戰</title>
  <!-- Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Canvas Confetti for Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #f0f8ff;
      --primary-color: #4a90e2;
      --secondary-color: #ff6b6b;
      --accent-color: #ffd166;
      --text-color: #2d3748;
      --card-bg: #ffffff;
      --success-color: #06d6a0;
      --danger-color: #ef476f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    /* Fixed Watermark Signature */
    .teacher-signature {
      position: fixed;
      top: 10px;
      right: 12px;
      font-size: 13px;
      color: #718096;
      font-weight: bold;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.85);
      padding: 4px 10px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      backdrop-filter: blur(4px);
    }

    /* Orientation Warning Overlay for Mobile Portrait */
    #portrait-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #1a202c;
      color: #ffffff;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    #portrait-warning .rotate-icon {
      font-size: 60px;
      margin-bottom: 20px;
      animation: rotate-anim 2s infinite ease-in-out;
    }

    @keyframes rotate-anim {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }

    @media screen and (orientation: portrait) and (max-width: 900px) {
      #portrait-warning {
        display: flex;
      }
    }

    /* Screen Management */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      padding: 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen.active {
      display: flex;
    }

    /* UI Components */
    .card {
      background: var(--card-bg);
      padding: 24px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #718096;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #4a5568;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: var(--primary-color);
      color: white;
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #a0aec0;
      box-shadow: 0 4px 12px rgba(160, 174, 192, 0.3);
    }

    .btn-danger {
      background: var(--danger-color);
      box-shadow: 0 4px 12px rgba(239, 71, 111, 0.3);
    }

    .db-status {
      margin-top: 15px;
      font-size: 13px;
      color: #a0aec0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #cbd5e0;
    }

    .status-dot.connected {
      background: var(--success-color);
    }

    /* Lobby Screen */
    .lobby-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin-bottom: 16px;
    }

    .room-list-container {
      width: 100%;
      max-width: 600px;
      height: 260px;
      background: white;
      border-radius: 16px;
      padding: 12px;
      overflow-y: auto;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }

    .room-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f7fafc;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid #edf2f7;
    }

    .room-item:last-child {
      margin-bottom: 0;
    }

    .room-info {
      text-align: left;
    }

    .room-host {
      font-weight: bold;
      color: #2d3748;
    }

    .room-code {
      font-size: 12px;
      color: #a0aec0;
    }

    .btn-join {
      width: auto;
      padding: 8px 16px;
      font-size: 14px;
    }

    /* Waiting Screen */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #edf2f7;
      border-top: 5px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Battle Screen - Optimised for Single Viewport */
    #screen-battle {
      padding: 10px;
      justify-content: space-between;
    }

    .battle-hud {
      display: flex;
      width: 100%;
      max-width: 800px;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 8px 16px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 42%;
    }

    .player-card.right {
      flex-direction: row-reverse;
      text-align: right;
    }

    .player-avatar {
      font-size: 36px;
      background: #edf2f7;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .player-meta {
      flex: 1;
    }

    .player-name {
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
    }

    .hp-bar-bg {
      width: 100%;
      height: 12px;
      background: #edf2f7;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }

    .hp-bar-fill {
      height: 100%;
      background: var(--success-color);
      width: 100%;
      transition: width 0.3s ease-out, background-color 0.3s;
    }

    .vs-badge {
      font-size: 18px;
      font-weight: 900;
      color: var(--secondary-color);
      font-style: italic;
    }

    .question-card {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      text-align: center;
      margin: 10px 0;
      position: relative;
    }

    .question-text {
      font-size: 32px;
      font-weight: bold;
      color: #1a202c;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 800px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      font-size: 22px;
      font-weight: bold;
      color: #2d3748;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    .option-btn:hover {
      border-color: var(--primary-color);
      background: #ebf8ff;
    }

    .option-btn:active {
      transform: scale(0.97);
    }

    /* Attack & Hit Animations */
    .anim-shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .anim-flash-red {
      animation: flash-red 0.4s ease-out;
    }

    @keyframes flash-red {
      0% { background-color: rgba(239, 71, 111, 0.4); }
      100% { background-color: var(--bg-color); }
    }

    /* Floating feedback text */
    .feedback-toast {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .feedback-toast.show {
      top: 10px;
      opacity: 1;
    }

    .feedback-toast.correct {
      background: var(--success-color);
      color: white;
    }

    .feedback-toast.wrong {
      background: var(--danger-color);
      color: white;
    }

    /* Result & Disconnect Overlay */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .overlay.active {
      display: flex;
    }

    .result-box {
      background: white;
      padding: 32px;
      border-radius: 24px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .result-title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .result-desc {
      font-size: 16px;
      color: #4a5568;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="teacher-signature">你最愛的老師設計</div>

  <!-- Mobile Portrait Warning -->
  <div id="portrait-warning">
    <div class="rotate-icon">↻</div>
    <h2>請將手機轉為橫向操作</h2>
    <p style="margin-top: 10px; color: #a0aec0;">獲得最佳對戰體驗</p>
  </div>

  <!-- 1. Screen: Home / Login -->
  <div id="screen-home" class="screen active">
    <div class="card">
      <h1>整數加減大決鬥</h1>
      <p class="subtitle">七年級數學科 • 雙人即時線上對戰</p>
      
      <div class="input-group">
        <label for="input-nickname">請輸入學生暱稱：</label>
        <input type="text" id="input-nickname" placeholder="例如：解題小達人" maxlength="20">
      </div>

      <button id="btn-enter" class="btn">進入遊戲大廳</button>

      <div class="db-status">
        <div id="db-dot" class="status-dot"></div>
        <span id="db-status-text">正在連線至資料庫...</span>
      </div>
    </div>
  </div>

  <!-- 2. Screen: Lobby -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-header">
      <div>
        <span style="color: #718096; font-size: 14px;">玩家暱稱：</span>
        <strong id="display-my-name" style="font-size: 18px;">-</strong>
      </div>
      <button id="btn-create-room" class="btn" style="width: auto; padding: 10px 20px;">+ 建立對戰房間</button>
    </div>

    <div class="room-list-container" id="room-list">
      <!-- Live rooms will be rendered here dynamically -->
    </div>
  </div>

  <!-- 3. Screen: Waiting -->
  <div id="screen-waiting" class="screen">
    <div class="card">
      <h2>等待第二位玩家加入...</h2>
      <div class="spinner"></div>
      <p style="color: #718096; margin-bottom: 20px;">房間已開立，請提醒同桌同學加入對戰！</p>
      <button id="btn-cancel-room" class="btn btn-secondary">取消房間並返回</button>
    </div>
  </div>

  <!-- 4. Screen: Battle -->
  <div id="screen-battle" class="screen">
    <!-- Battle HUD Header -->
    <div class="battle-hud">
      <!-- Player 1 / Self (Left) -->
      <div class="player-card">
        <div class="player-avatar" id="avatar-left">🐱</div>
        <div class="player-meta">
          <div class="player-name" id="name-left">我方</div>
          <div class="hp-bar-bg">
            <div class="hp-bar-fill" id="hp-left" style="width: 100%;"></div>
          </div>
        </div>
      </div>

      <div class="vs-badge">VS</div>

      <!-- Player 2 / Opponent (Right) -->
      <div class="player-card right">
        <div class="player-avatar" id="avatar-right">🐶</div>
        <div class="player-meta">
          <div class="player-name" id="name-right">對手</div>
          <div class="hp-bar-bg">
            <div class="hp-bar-fill" id="hp-right" style="width: 100%;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Question Box -->
    <div class="question-card" id="question-card">
      <div id="feedback-toast" class="feedback-toast">答對！</div>
      <div class="question-text" id="question-text">(-5) + 8 = ?</div>
    </div>

    <!-- Options 2x2 Grid -->
    <div class="options-grid">
      <button class="option-btn" onclick="handleOptionClick(0)" id="opt-0">A. 3</button>
      <button class="option-btn" onclick="handleOptionClick(1)" id="opt-1">B. -3</button>
      <button class="option-btn" onclick="handleOptionClick(2)" id="opt-2">C. 13</button>
      <button class="option-btn" onclick="handleOptionClick(3)" id="opt-3">D. -13</button>
    </div>
  </div>

  <!-- Game Over / Disconnect Result Overlay -->
  <div id="result-overlay" class="overlay">
    <div class="result-box">
      <div id="result-emoji" style="font-size: 60px; margin-bottom: 10px;">🏆</div>
      <div id="result-title" class="result-title">榮獲勝利！</div>
      <div id="result-desc" class="result-desc">精彩的運算對決！你展現了優秀的整數加減運算實力。</div>
      <button id="btn-return-lobby" class="btn">回到遊戲大廳</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Supabase Initialization
    // ==========================================
    const SUPABASE_URL = 'https://vobuwdmarskywyasfnqh.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dCCxhsVjudLeQG15OeI6uw_Zn8o0r-l';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // ==========================================
    // 2. Global Application State
    // ==========================================
    let nickname = '';
    let clientToken = '';
    let currentScreen = 'home';
    let currentRoomId = null;
    let currentSeat = null;
    let currentQuestion = null;
    let lastProcessedEventId = null;
    let latestGameState = null;

    // Channels and Timers
    let lobbyChannel = null;
    let gameChannel = null;
    let heartbeatTimer = null;
    let disconnectTimer = null;
    let opponentWasPresent = false;

    // Animal Avatars Selection
    const ANIMAL_AVATARS = ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐧', '🐸'];

    // Client Token Setup
    function initClientToken() {
      let token = localStorage.getItem('sequence_battle_client_token');
      if (!token) {
        token = crypto.randomUUID();
        localStorage.setItem('sequence_battle_client_token', token);
      }
      clientToken = token;
    }

    // ==========================================
    // 3. UI Navigation & Screen Control
    // ==========================================
    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(`screen-${screenId}`);
      if (target) {
        target.classList.add('active');
        currentScreen = screenId;
      }
    }

    function checkDatabaseConnection() {
      supabaseClient.from('rooms').select('id', { count: 'exact', head: true })
        .then(({ error }) => {
          const dot = document.getElementById('db-dot');
          const statusText = document.getElementById('db-status-text');
          if (!error) {
            dot.classList.add('connected');
            statusText.innerText = '資料庫已連接';
          } else {
            statusText.innerText = '連線失敗，請檢查網路';
          }
        });
    }

    // ==========================================
    // 4. Math Question Generator (7th Grade Math)
    // ==========================================
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateMathQuestion() {
      const type = getRandomInt(1, 4);
      let a = getRandomInt(-20, 20);
      let b = getRandomInt(-20, 20);
      while (a === 0) a = getRandomInt(-20, 20);
      while (b === 0) b = getRandomInt(-20, 20);

      let questionStr = '';
      let correctAnswer = 0;

      const formatNum = (num) => num < 0 ? `(${num})` : `${num}`;

      switch (type) {
        case 1: // a + b
          questionStr = `${formatNum(a)} + ${formatNum(b)} = ?`;
          correctAnswer = a + b;
          break;
        case 2: // a - b
          questionStr = `${formatNum(a)} - ${formatNum(b)} = ?`;
          correctAnswer = a - b;
          break;
        case 3: // (-a) - (-b)
          a = -Math.abs(a);
          b = -Math.abs(b);
          questionStr = `${formatNum(a)} - ${formatNum(b)} = ?`;
          correctAnswer = a - b;
          break;
        case 4: // a + (-b)
          b = -Math.abs(b);
          questionStr = `${formatNum(a)} + ${formatNum(b)} = ?`;
          correctAnswer = a + b;
          break;
      }

      // Generate 3 unique wrong options
      const optionsSet = new Set();
      optionsSet.add(correctAnswer);

      const wrongCandidates = [
        correctAnswer + getRandomInt(1, 5),
        correctAnswer - getRandomInt(1, 5),
        -correctAnswer,
        a - b,
        a + b,
        correctAnswer + 10,
        correctAnswer - 10
      ];

      for (let wrong of wrongCandidates) {
        if (wrong !== correctAnswer && !optionsSet.has(wrong)) {
          optionsSet.add(wrong);
        }
        if (optionsSet.size === 4) break;
      }

      while (optionsSet.size < 4) {
        let dummy = correctAnswer + getRandomInt(-15, 15);
        if (dummy !== correctAnswer) optionsSet.add(dummy);
      }

      const options = Array.from(optionsSet);
      // Shuffle options
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }

      const correctIndex = options.indexOf(correctAnswer);

      return {
        questionText: questionStr,
        options: options.map(o => String(o)),
        correctIndex: correctIndex
      };
    }

    function renderCurrentQuestion() {
      currentQuestion = generateMathQuestion();
      document.getElementById('question-text').innerText = currentQuestion.questionText;
      const labels = ['A', 'B', 'C', 'D'];
      for (let i = 0; i < 4; i++) {
        document.getElementById(`opt-${i}`).innerText = `${labels[i]}. ${currentQuestion.options[i]}`;
      }
    }

    // ==========================================
    // 5. Lobby Logic & Realtime Updates
    // ==========================================
    async function refreshLobbyRooms() {
      try {
        const { data, error } = await supabaseClient.rpc('list_live_rooms');
        if (error) throw error;

        const container = document.getElementById('room-list');
        container.innerHTML = '';

        if (!data || data.length === 0) {
          container.innerHTML = `<div style="text-align:center; color:#a0aec0; padding: 40px 0;">目前無等待對戰的房間<br>按下右上角「+ 建立對戰房間」開始吧！</div>`;
          return;
        }

        data.forEach(room => {
          const item = document.createElement('div');
          item.className = 'room-item';
          item.innerHTML = `
            <div class="room-info">
              <div class="room-host">房主：${escapeHtml(room.host_nickname)}</div>
              <div class="room-code">房號：${room.room_code}</div>
            </div>
            <button class="btn btn-join" onclick="handleJoinProbe('${room.id}')">加入對戰</button>
          `;
          container.appendChild(item);
        });
      } catch (err) {
        console.error('Failed to list live rooms:', err);
      }
    }

    function subscribeLobbyRealtime() {
      if (lobbyChannel) return;
      lobbyChannel = supabaseClient.channel('public:rooms')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => {
          refreshLobbyRooms();
        })
        .subscribe();
    }

    function unsubscribeLobbyRealtime() {
      if (lobbyChannel) {
        supabaseClient.removeChannel(lobbyChannel);
        lobbyChannel = null;
      }
    }

    // ==========================================
    // 6. Host Heartbeat Management
    // ==========================================
    function startHostHeartbeat(roomId) {
      stopHostHeartbeat();
      heartbeatTimer = setInterval(async () => {
        try {
          await supabaseClient.rpc('heartbeat_room', {
            p_room_id: roomId,
            p_client_token: clientToken
          });
        } catch (e) {
          console.warn('Heartbeat failed:', e);
        }
      }, 3000);
    }

    function stopHostHeartbeat() {
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
    }

    // ==========================================
    // 7. Handshake: 2-Second Join Probe
    // ==========================================
    async function handleJoinProbe(targetRoomId) {
      const probeId = crypto.randomUUID();
      const probeTopic = `game-${targetRoomId}`;
      const tempChannel = supabaseClient.channel(probeTopic);

      let ackReceived = false;

      tempChannel.on('broadcast', { event: 'host_ack' }, (payload) => {
        if (payload.payload && payload.payload.probe_id === probeId) {
          ackReceived = true;
        }
      }).subscribe();

      // Send probe after slight delay to allow subscription readiness
      setTimeout(() => {
        tempChannel.send({
          type: 'broadcast',
          event: 'join_probe',
          payload: { probe_id: probeId }
        });
      }, 200);

      // Wait up to 2000 ms
      setTimeout(async () => {
        supabaseClient.removeChannel(tempChannel);
        if (ackReceived) {
          executeJoinRoom(targetRoomId);
        } else {
          alert('房主已離開，請選其他房間。');
          refreshLobbyRooms();
        }
      }, 2000);
    }

    async function executeJoinRoom(targetRoomId) {
      try {
        const { data, error } = await supabaseClient.rpc('join_room', {
          p_room_id: targetRoomId,
          p_nickname: nickname,
          p_client_token: clientToken
        });

        if (error) {
          if (error.message.includes('HOST_OFFLINE')) {
            alert('房主已離線，請選擇其他房間。');
          } else if (error.message.includes('ROOM_ALREADY_FULL')) {
            alert('房間人數已滿，請選擇其他房間。');
          } else {
            alert('加入失敗：' + error.message);
          }
          refreshLobbyRooms();
          return;
        }

        const res = data[0];
        currentRoomId = res.room_id;
        currentSeat = 2;
        enterBattleScreen();

      } catch (err) {
        alert('加入房間時發生錯誤');
        refreshLobbyRooms();
      }
    }

    // Host probe listener setup during waiting screen
    function listenForProbes(roomId) {
      if (!gameChannel) {
        gameChannel = supabaseClient.channel(`game-${roomId}`);
      }
      gameChannel.on('broadcast', { event: 'join_probe' }, (payload) => {
        if (payload.payload && payload.payload.probe_id) {
          gameChannel.send({
            type: 'broadcast',
            event: 'host_ack',
            payload: { probe_id: payload.payload.probe_id }
          });
        }
      }).subscribe();
    }

    // ==========================================
    // 8. Battle Screen Setup & Realtime Engine
    // ==========================================
    function enterBattleScreen() {
      stopHostHeartbeat();
      unsubscribeLobbyRealtime();
      switchScreen('battle');

      // Deterministic Avatars based on room_id
      const seed = currentRoomId.replace(/-/g, '');
      const idx1 = parseInt(seed.substring(0, 2), 16) % ANIMAL_AVATARS.length;
      let idx2 = parseInt(seed.substring(2, 4), 16) % ANIMAL_AVATARS.length;
      if (idx1 === idx2) idx2 = (idx1 + 1) % ANIMAL_AVATARS.length;

      const p1Avatar = ANIMAL_AVATARS[idx1];
      const p2Avatar = ANIMAL_AVATARS[idx2];

      if (currentSeat === 1) {
        document.getElementById('avatar-left').innerText = p1Avatar;
        document.getElementById('avatar-right').innerText = p2Avatar;
      } else {
        document.getElementById('avatar-left').innerText = p2Avatar;
        document.getElementById('avatar-right').innerText = p1Avatar;
      }

      renderCurrentQuestion();
      setupBattleRealtime();
    }

    function setupBattleRealtime() {
      if (!gameChannel) {
        gameChannel = supabaseClient.channel(`game-${currentRoomId}`);
      }

      // Presence Monitoring
      gameChannel
        .on('presence', { event: 'sync' }, () => {
          const state = gameChannel.presenceState();
          const tokens = Object.keys(state);
          
          if (tokens.length >= 2) {
            opponentWasPresent = true;
            if (disconnectTimer) {
              clearTimeout(disconnectTimer);
              disconnectTimer = null;
            }
          } else if (opponentWasPresent && tokens.length < 2) {
            if (!disconnectTimer) {
              disconnectTimer = setTimeout(() => {
                showDisconnectionOverlay();
              }, 5000);
            }
          }
        })
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'game_state',
          filter: `room_id=eq.${currentRoomId}`
        }, (payload) => {
          syncGameState(payload.new);
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await gameChannel.track({
              seat: currentSeat,
              nickname: nickname,
              client_token: clientToken
            });
          }
        });

      // Initial Fetch of Game State
      supabaseClient
        .from('game_state')
        .select('*')
        .eq('room_id', currentRoomId)
        .single()
        .then(({ data }) => {
          if (data) syncGameState(data);
        });
    }

    // Synchronize UI with game_state Truth
    function syncGameState(state) {
      latestGameState = state;

      const myHp = currentSeat === 1 ? state.player1_hp : state.player2_hp;
      const opHp = currentSeat === 1 ? state.player2_hp : state.player1_hp;

      const myName = currentSeat === 1 ? state.player1_name : state.player2_name;
      const opName = currentSeat === 1 ? state.player2_name : state.player1_name;

      document.getElementById('name-left').innerText = myName || '我方';
      document.getElementById('name-right').innerText = opName || '對手';

      document.getElementById('hp-left').style.width = `${(myHp / 7) * 100}%`;
      document.getElementById('hp-right').style.width = `${(opHp / 7) * 100}%`;

      // Color transition for HP
      document.getElementById('hp-left').style.backgroundColor = myHp <= 2 ? '#ef476f' : '#06d6a0';
      document.getElementById('hp-right').style.backgroundColor = opHp <= 2 ? '#ef476f' : '#06d6a0';

      // Event Animation Trigger
      if (state.last_event_id && state.last_event_id !== lastProcessedEventId) {
        lastProcessedEventId = state.last_event_id;
        triggerBattleAnimation(state.last_event_type, state.last_event_seat);
      }

      // Winner Check
      if (state.status === 'finished' && state.winner_seat) {
        showVictoryResult(state.winner_seat === currentSeat);
      }
    }

    // ==========================================
    // 9. Answer Handling & Animations
    // ==========================================
    async function handleOptionClick(selectedIndex) {
      if (!currentQuestion || !currentRoomId) return;

      const isCorrect = (selectedIndex === currentQuestion.correctIndex);

      showFeedbackToast(isCorrect);

      try {
        await supabaseClient.rpc('resolve_answer', {
          p_room_id: currentRoomId,
          p_client_token: clientToken,
          p_is_correct: isCorrect
        });
      } catch (err) {
        console.error('Error resolving answer:', err);
      }

      // Instantly generate next question for seamless gameplay
      renderCurrentQuestion();
    }

    function showFeedbackToast(isCorrect) {
      const toast = document.getElementById('feedback-toast');
      toast.innerText = isCorrect ? '答對！ 🎯' : '答錯！ ⚡';
      toast.className = `feedback-toast ${isCorrect ? 'correct' : 'wrong'} show`;

      setTimeout(() => {
        toast.classList.remove('show');
      }, 800);
    }

    function triggerBattleAnimation(eventType, actorSeat) {
      const qCard = document.getElementById('question-card');
      const body = document.body;

      if (eventType === 'hit') {
        if (actorSeat === currentSeat) {
          // I hit the opponent -> Punch animation
          qCard.classList.add('anim-shake');
          setTimeout(() => qCard.classList.remove('anim-shake'), 400);
        } else {
          // Opponent hit me -> Red flash on screen
          body.classList.add('anim-flash-red');
          setTimeout(() => body.classList.remove('anim-flash-red'), 400);
        }
      } else if (eventType === 'self_hit') {
        if (actorSeat === currentSeat) {
          body.classList.add('anim-flash-red');
          setTimeout(() => body.classList.remove('anim-flash-red'), 400);
        }
      }
    }

    // ==========================================
    // 10. Result Overlay & Cleanup
    // ==========================================
    function showVictoryResult(isWinner) {
      const overlay = document.getElementById('result-overlay');
      const emoji = document.getElementById('result-emoji');
      const title = document.getElementById('result-title');
      const desc = document.getElementById('result-desc');

      if (isWinner) {
        emoji.innerText = '🏆';
        title.innerText = '榮獲勝利！';
        title.style.color = 'var(--primary-color)';
        desc.innerText = '太厲害了！你精準展現了七年級整數加減法的速算實力！';
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      } else {
        emoji.innerText = '💪';
        title.innerText = '再接再厲！';
        title.style.color = 'var(--text-color)';
        desc.innerText = '這次對決非常精彩，注意正負號變號規則，下次一定能擊敗對手！';
      }

      overlay.classList.add('active');
    }

    function showDisconnectionOverlay() {
      const overlay = document.getElementById('result-overlay');
      document.getElementById('result-emoji').innerText = '📡';
      document.getElementById('result-title').innerText = '對手已斷線';
      document.getElementById('result-desc').innerText = '與對手的即時連線已中斷超過 5 秒。';
      overlay.classList.add('active');
    }

    function cleanupGameSession() {
      stopHostHeartbeat();
      if (disconnectTimer) {
        clearTimeout(disconnectTimer);
        disconnectTimer = null;
      }
      if (gameChannel) {
        supabaseClient.removeChannel(gameChannel);
        gameChannel = null;
      }
      currentRoomId = null;
      currentSeat = null;
      currentQuestion = null;
      lastProcessedEventId = null;
      latestGameState = null;
      opponentWasPresent = false;

      document.getElementById('result-overlay').classList.remove('active');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ==========================================
    // 11. Event Listeners Initialization
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      initClientToken();
      checkDatabaseConnection();

      // Enter Lobby
      document.getElementById('btn-enter').addEventListener('click', () => {
        const val = document.getElementById('input-nickname').value.trim();
        if (!val) {
          alert('請輸入暱稱！');
          return;
        }
        nickname = val;
        document.getElementById('display-my-name').innerText = nickname;
        switchScreen('lobby');
        refreshLobbyRooms();
        subscribeLobbyRealtime();
      });

      // Create Room
      document.getElementById('btn-create-room').addEventListener('click', async () => {
        try {
          const { data, error } = await supabaseClient.rpc('create_room', {
            p_nickname: nickname,
            p_client_token: clientToken
          });

          if (error) throw error;

          const res = data[0];
          currentRoomId = res.room_id;
          currentSeat = 1;

          switchScreen('waiting');
          startHostHeartbeat(currentRoomId);
          listenForProbes(currentRoomId);

          // Watch for seat 2 joining
          if (!gameChannel) {
            gameChannel = supabaseClient.channel(`game-${currentRoomId}`);
          }
          gameChannel.on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'rooms',
            filter: `id=eq.${currentRoomId}`
          }, (payload) => {
            if (payload.new.status === 'playing') {
              enterBattleScreen();
            }
          }).subscribe();

        } catch (err) {
          alert('建立房間失敗：' + err.message);
        }
      });

      // Cancel Room
      document.getElementById('btn-cancel-room').addEventListener('click', async () => {
        if (currentRoomId) {
          try {
            await supabaseClient.rpc('cancel_room', {
              p_room_id: currentRoomId,
              p_client_token: clientToken
            });
          } catch (e) {
            console.warn('Cancel room failed:', e);
          }
        }
        cleanupGameSession();
        switchScreen('lobby');
        subscribeLobbyRealtime();
        refreshLobbyRooms();
      });

      // Return to Lobby from Result
      document.getElementById('btn-return-lobby').addEventListener('click', () => {
        cleanupGameSession();
        switchScreen('lobby');
        subscribeLobbyRealtime();
        refreshLobbyRooms();
      });

      // Pagehide Beacon for fast room cancellation
      window.addEventListener('pagehide', () => {
        if (currentRoomId && currentSeat === 1 && currentScreen === 'waiting') {
          navigator.sendBeacon(
            `${SUPABASE_URL}/rest/v1/rpc/cancel_room`,
            JSON.stringify({ p_room_id: currentRoomId, p_client_token: clientToken })
          );
        }
      });
    });
  </script>
